<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/admin.css">
    <title>Settings - Admin</title>
</head>
<body>
    <div class="content-padding">
        <div class="dashboard-grid">
            <div class="card-container">
                <div class="section-header"><h2><i class="fa-solid fa-user-gear"></i> Admin Profile</h2></div>
                <form id="profileForm" style="display: flex; flex-direction: column; gap: 15px;">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="set-username" class="btn-outline" style="width: 100%; padding: 10px;" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="set-email" class="btn-outline" style="width: 100%; padding: 10px;">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>

            <div class="card-container">
                <div class="section-header"><h2><i class="fa-solid fa-shield-halved"></i> Security</h2></div>
                <p style="color: #64748B; font-size: 0.9rem;">Change your administrative password regularly to keep the inventory safe.</p>
                <button class="btn btn-outline" style="margin-top: 15px; color: #E74C3C; border-color: #FCA5A5;">
                    Change Password
                </button>
            </div>
        </div>

        <div class="card-container" style="margin-top: 25px;">
            <div class="section-header">
                <h2><i class="fa-solid fa-user-plus"></i> Register New Staff/Teacher</h2>
            </div>
            <form id="registerUserForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="text" placeholder="Username" id="reg-username" required style="padding: 10px;">
                <input type="email" placeholder="Email" id="reg-email" required style="padding: 10px;">
                <input type="password" placeholder="Initial Password" id="reg-password" required style="padding: 10px;">
                <select id="reg-role" style="padding: 10px;">
                    <option value="USER">Staff / Teacher</option>
                    <option value="ADMIN">System Admin</option>
                </select>
                <button type="submit" class="btn btn-primary" style="grid-column: span 2;">Create Account</button>
            </form>
        </div>
    </div>
    <script src="/frontend/js/settings.js"></script>
</body>
</html>
