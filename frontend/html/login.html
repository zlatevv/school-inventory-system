<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #2B4E70;
            --primary-color: #2488A6;
            --bg-light: #F4F7F9;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            color: var(--sidebar-bg);
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 10px; color: #1E293B; }
        p { color: #64748B; margin-bottom: 30px; }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover { background: #1d6e87; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fa-solid fa-book-open fa-3x"></i></div>
        <h2>Welcome Back</h2>
        <p>Please enter your details to sign in.</p>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="admin@school.edu">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••">
        </div>

        <button class="login-btn" onclick="window.location.href='admin.html'">Sign In</button>
    </div>
</body>
</html>
