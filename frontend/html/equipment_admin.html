<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Catalog | Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="equipment_admin.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <div class="logo-text">
                School <br> Inventory Management System
            </div>
        </div>

        <ul class="nav-menu">
            <li><a href="admin.html" class="nav-item"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
            <li><a href="equipment_admin.html" class="nav-item active"><i class="fa-solid fa-folder"></i> Equipment Catalog</a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> Pending Requests <span class="badge-count">5</span></a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-chart-simple"></i> Reports</a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Settings <i class="fa-solid fa-chevron-down" style="margin-left:auto; font-size:0.8rem;"></i></a></li>
        </ul>

        <div class="sidebar-footer">
            <a href="#" class="logout-link" id="openLogout"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header>
    <div class="header-right">
        <div class="user-profile">
            <div class="user-info">
                <div class="avatar-circle">US</div>
                <span>Админ Георгиев</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </div>
    </header>

        <div class="content-padding">
            <div class="browse-header">
                <div class="title-section">
                    <h1>Manage Inventory</h1>
                    <p>Add, edit, or remove school technology assets.</p>
                </div>
                
                <div class="search-filters">
                    <button class="btn-add-new" onclick="addNewItem()">+ Add Asset</button>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="equipmentSearch" placeholder="Search by name or ID...">
                    </div>
                    <select id="categorySelect" class="filter-dropdown">
                        <option value="all">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Computers">Computers</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
            </div>

            <div class="equipment-grid" id="adminEquipmentGrid">
                </div>
        </div>
    </main>

    <div id="logoutModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h2>Sign Out</h2>
        <p>Are you sure you want to log out of your profile?</p>
        <div class="modal-buttons">
            <button id="confirmLogout" class="modal-btn btn-danger">Yes, Logout</button>
            <button id="cancelLogout" class="modal-btn btn-outline">No, stay here</button>
        </div>
    </div>
</div>

    <script src="equipment_admin.js"></script>
</body>
</html>
