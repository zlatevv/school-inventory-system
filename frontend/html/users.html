<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/admin.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <div class="logo-text">
                School <br> Inventory Management System
            </div>
        </div>
    
        <ul class="nav-menu">
            <li><a href="admin.html" class="nav-item"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
            <li><a href="catalog.html" class="nav-item"><i class="fa-solid fa-folder"></i> Equipment Catalog</a></li>
            <li><a href="requests.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> Pending Requests <span class="badge-count">5</span></a></li>
            <li><a href="users.html" class="nav-item"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-chart-simple"></i> Reports</a></li>
            <li><a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Settings <i class="fa-solid fa-chevron-down" style="margin-left:auto; font-size:0.8rem;"></i></a></li>
        </ul>

        <div class="logout-btn">
            <a href="#" class="nav-item" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-power-off"></i> Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <div class="mobile-menu-btn" id="menuBtn" style="display: none;">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="equipSearch" placeholder="Search equipment...">
                </div>
            </div>

            <div class="header-right">
                <div class="user-info">
                    <div class="user-text">
                        <strong id="display-username"></strong>
                    </div>
                    <img id="user-avatar" src="https://placehold.co/40x40/2B8EAD/FFFFFF?text=AD" alt="Admin">
                </div>
            </div>
        </header>

        <div class="content-padding">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2>User Management</h2>
                <button class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Register New User</button>
            </div>

            <div class="card-container" style="padding: 0; overflow: hidden; background: white; border-radius: 12px; border: 1px solid var(--border-color);">
                <table class="users-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #F8FAFC; text-align: left; border-bottom: 2px solid #E2E8F0;">
                            <th style="padding: 20px; color: var(--text-gray); font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">User Profile</th>
                            <th style="padding: 20px; color: var(--text-gray); font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">Role & Registration</th>
                            <th style="padding: 20px; text-align: right; color: var(--text-gray); font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                       
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="logoutModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to log out of your profile?</p>
            <div class="modal-buttons">
                <button id="confirmLogout" class="modal-btn" style="background: #EF4444; color: white;">Yes, Logout</button>
                <button id="cancelLogout" class="modal-btn btn-outline">No, stay here</button>
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: left; max-width: 400px;">
            <h2 style="margin-bottom: 20px; color: var(--text-dark);">Register New User</h2>
            <form id="registerForm">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Username</label>
                    <input type="text" id="regUsername" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Email</label>
                    <input type="email" id="regEmail" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Password</label>
                    <input type="password" id="regPassword" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Role</label>
                    <select id="regRole" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn btn-primary" style="background: #2B8EAD; color: white;">Register</button>
                    <button type="button" class="modal-btn btn-outline" onclick="closeModal('registerModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: left; max-width: 400px;">
            <h2 style="margin-bottom: 20px; color: var(--text-dark);">Edit User</h2>
            <form id="editForm">
                <input type="hidden" id="editOriginalUsername">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Username</label>
                    <input type="text" id="editUsername" readonly style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px; background: #F1F5F9;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Email</label>
                    <input type="email" id="editEmail" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="font-size: 0.85rem; color: var(--text-gray); font-weight: 600;">Role</label>
                    <select id="editRole" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 6px;">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn btn-primary" style="background: #2B8EAD; color: white;">Save Changes</button>
                    <button type="button" class="modal-btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/js/admin.js"></script>
    <script src="/frontend/js/user_management.js"></script>
    <script src="/frontend/js/admin-ui.js"></script>
</body>
</html>
