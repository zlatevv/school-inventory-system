<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-microchip"></i></div>
            <div class="logo-text">School <br> Inventory Management System</div>
        </div>
        <ul class="nav-menu">
            <li><a href="admin.html" class="nav-item"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
            <li><a href="catalog.html" class="nav-item"><i class="fa-solid fa-folder"></i> Equipment Catalog</a></li>
            <li><a href="requests.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> Pending Requests <span class="badge-count" style="display: none;">5</span></a></li>
            <li><a href="users.html" class="nav-item"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-simple"></i> Reports</a></li>
            <li><a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings <i class="fa-solid fa-chevron-down" style="margin-left:auto; font-size:0.8rem;"></i></a></li>
        </ul>
        <div class="logout-btn">
            <a href="#" class="nav-item" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-power-off"></i> Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <div class="mobile-menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-text"><strong id="display-username"></strong></div>
                    <img id="user-avatar" src="https://placehold.co/40x40/2B8EAD/FFFFFF?text=AD" alt="Admin">
                </div>
            </div>
        </header>

        <div class="content-padding">
            <div class="section-header" style="margin-bottom: 25px;">
                <h2>User Management</h2>
                <button class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Register New User</button>
            </div>

            <div class="card-container" style="padding: 0; overflow: hidden;">
                <div class="table-responsive">
                    <table class="requests-table">
                        <thead>
                            <tr>
                                <th>User Profile</th>
                                <th>Role & Registration</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="logoutModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to log out of your profile?</p>
            <div class="modal-buttons">
                <button id="confirmLogout" class="modal-btn" style="background: #EF4444; color: white;">Yes, Logout</button>
                <button id="cancelLogout" class="modal-btn btn-outline">No, stay here</button>
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: left;">
            <h2 style="margin-bottom: 20px; color: var(--text-dark);">Register New User</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn" style="background: #2B8EAD; color: white;">Register</button>
                    <button type="button" class="modal-btn btn-outline" onclick="closeModal('registerModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: left;">
            <h2 style="margin-bottom: 20px; color: var(--text-dark);">Edit User</h2>
            <form id="editForm">
                <input type="hidden" id="editOriginalUsername">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername" readonly style="background: #F1F5F9;">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn" style="background: #2B8EAD; color: white;">Save Changes</button>
                    <button type="button" class="modal-btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
    <script src="/js/user_management.js"></script>
    <script src="/js/admin-ui.js"></script>
    <script>
    (function(){
      var menuBtn = document.getElementById('menuBtn');
      var sidebar = document.querySelector('.sidebar');
      var overlay = document.getElementById('sidebarOverlay');
      if(menuBtn && sidebar){
        menuBtn.addEventListener('click', function(e){
          e.stopPropagation();
          sidebar.classList.toggle('active');
          if(overlay) overlay.classList.toggle('active');
        });
      }
      if(overlay){
        overlay.addEventListener('click', function(){
          sidebar.classList.remove('active');
          overlay.classList.remove('active');
        });
      }
    })();
    </script>
</body>
</html>
