<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox | Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/user.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <div class="logo-text">
                School <br> Inventory Management System
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="user.html" class="nav-item"><i class="fa-solid fa-square-plus"></i> Dashboard</a></li>
            <li><a href="browse_equipment.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Browse Equipment</a></li>
            <li><a href="my_requests.html" class="nav-item"><i class="fa-regular fa-folder"></i> My Requests <span class="badge-count">2</span></a></li>
            <li><a href="history_user.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
            <li><a href="inbox.html" class="nav-item active"><i class="fa-solid fa-envelope"></i> Inbox <span class="badge-count red-badge">3</span></a></li>
        </ul>
        <div class="logout-btn">
            <a href="#" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="search-bar">
            </div>

            <div class="user-profile">
                <div class="user-info">
                <img src="https://ui-avatars.com/api/?name=User&background=2488A6&color=fff" alt="User">
                <span>Loading...</span>
                <i class="fa-solid fa-chevron-down"></i>
                </div>
             </div>
        </header>

        <div class="content-padding">
            <div class="page-header">
                <h1>Notifications & Messages</h1>
                <p>Stay updated with your requests and system alerts.</p>
            </div>

            <div class="inbox-search-container" style="margin-top: 25px;">
                <div class="search-box" style="position: relative; max-width: 400px;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-gray);"></i>
                    <input type="text" id="inboxSearch" placeholder="Search notifications..." style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 12px; border: 1px solid var(--border-color); outline: none;">
                </div>
            </div>

            <div class="inbox-container" id="inboxContainer" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                </div>
        </div>
    </main>

    <div id="logoutModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to log out?</p>
            <div class="modal-buttons">
                <button id="confirmLogout" class="modal-btn btn-danger">Yes, Logout</button>
                <button id="cancelLogout" class="modal-btn btn-outline">No, stay here</button>
            </div>
        </div>
    </div>

    <script src="/frontend/js/user.js"></script>
    <script src="/frontend/js/displayInfo.js"></script>
</body>
</html>
