version: '3.8'

services:
  # --- API GATEWAY (The Entry Point) ---
  api-gateway:
    build: ./backend/api-gateway
    environment:
      - PORT=9000
      - AUTH_SERVICE_URL=http://auth-service:8080
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      - REQUEST_SERVICE_URL=http://request-service:8084
      - REPORT_SERVICE_URL=http://report-service:8083
    depends_on:
      - auth-service
      - inventory-service
      - request-service
      - report-service

  # --- MICROSERVICES ---
  auth-service:
    build: ./backend/auth-service
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/school_inventory
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - db

  inventory-service:
    build: ./backend/inventory-service
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/school_inventory
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      - db

  notification-service:
    build: ./backend/notifications-service
    environment:
      - PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/school_inventory
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - db
      - rabbitmq

  report-service:
    build: ./backend/report-service
    environment:
      - PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/school_inventory
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      - REQUEST_SERVICE_URL=http://request-service:8084
    depends_on:
      - db
      - inventory-service
      - request-service

  request-service:
    build: ./backend/request-service
    environment:
      - PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/school_inventory
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_RABBITMQ_HOST=rabbitmq
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      - AUTH_SERVICE_URL=http://auth-service:8080
    depends_on:
      - db
      - rabbitmq
      - auth-service
      - inventory-service

  email-service:
    build: ./backend/email-service
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - EMAIL_PASSWORD=olvz ezop vqqz bhzw
    depends_on:
      - rabbitmq

  # --- DATABASE ---
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: school_inventory
      MYSQL_ROOT_PASSWORD: 1234
    # Премахнати healthchecks за по-бърз старт в облака

  rabbitmq:
    image: rabbitmq:3-management
    # Портовете тук не са нужни за външния свят, само вътрешно за услугите

  # --- FRONTEND ---
  frontend:
    build: ./frontend
    environment:
      - PORT=80
      # ВАЖНО: Тук по-късно ще сложиш публичния URL на api-gateway от Railway
      - API_GATEWAY_URL=http://api-gateway:9000
    depends_on:
      - api-gateway