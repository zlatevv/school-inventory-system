server:
  port: 9000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**

        - id: request-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/request/**,/api/requests/**,/api/manager/requests/**
        - id: inventory-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/equipment/**